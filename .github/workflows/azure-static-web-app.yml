name: Deploy Azure Static Web App

on:
  push:
    branches:
      - codex/2d
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - codex/2d
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: azure-static-web-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: sophkatsivelos-static/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: sophkatsivelos-static
        run: pnpm install --frozen-lockfile

      - name: Build production site
        working-directory: sophkatsivelos-static
        run: pnpm build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: sophkatsivelos-static/dist
          api_location: ""
          output_location: ""
          skip_app_build: true
          production_branch: codex/2d

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close preview environment
    steps:
      - name: Close Azure preview environment
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
